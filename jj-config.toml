# Formatting for `jj fix`. Install with scripts/setup-jj-config.sh.
#
# Scoped to source we own. A blanket **/*.edn also swept up the vendored configs
# under .clj-kondo/imports and the hand-laid-out data in resources/, rewriting
# files whose formatting is not ours to choose.
[fix.tools.zprint]
command = ["zprint", "{:style :community :map {:comma? false} :width 80}"]
patterns = [
  "glob:src/**/*.clj",
  "glob:src/**/*.cljc",
  "glob:src/**/*.cljs",
  "glob:dev/**/*.clj",
  "glob:dev/**/*.cljc",
  "glob:dev/**/*.cljs",
  "glob:scripts/**/*.clj",
  "deps.edn",
  "shadow-cljs.edn",
]

# `jj bookmark advance` defaults to moving the bookmark to @, which is the empty
# working copy jj commit leaves behind. Aim it at the closest revision actually
# worth pushing, so the ship sequence works without anyone's personal config.
[revsets]
bookmark-advance-to = 'closest_pushable(@)'

[revset-aliases]
# Closest revision that is mutable, described and either non-empty or a merge
'closest_pushable(to)' = '''
  heads(::to & mutable() & ~description(exact:"") & (~empty() | merges()))
'''
